name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    # The usage upsert and the migrations are SQL, and SQL only fails against a
    # server. Mocking the cursor proved nothing: a statement-level type error
    # shipped green through a full unit suite and silently dropped fleet-wide
    # utilization data. These tests skip themselves when TEST_DATABASE_URL is
    # unset, so without this service they would go on passing by not running.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reportmate
          POSTGRES_PASSWORD: reportmate
          POSTGRES_DB: reportmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://reportmate:reportmate@localhost:5432/reportmate
      DB_SSL: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -rs

  # The spec is a build product. Exporting it here proves the app still
  # imports and the schema still renders on every change, and leaves the
  # artifact for anyone who needs the spec for exactly this commit. The
  # website (reportmate/reportmate-website, openapi-sync workflow) exports
  # the same file from main on its own schedule and publishes it at
  # /openapi.json, so an integrator always reads the deployed contract.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export the OpenAPI spec
        run: |
          python scripts/export_openapi.py
          python - <<'EOF'
          import json
          spec = json.load(open("docs/api/openapi.json"))
          paths = len(spec["paths"])
          assert paths >= 50, f"spec looks truncated: {paths} paths"
          assert "securitySchemes" in spec.get("components", {}), "auth schemes missing"
          print(f"{paths} paths, schemes: {sorted(spec['components']['securitySchemes'])}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/api/openapi.json

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
